# Scripts de instalação permitidos. `false` não quebra o pacote: só não roda o
# postinstall dele.
#
# unrs-resolver (puxado pelo eslint-config-next) traz o binário nativo por
# pacotes opcionais; o script só serve de reserva e não precisa rodar.
allowBuilds:
  '@firebase/util': false
  protobufjs: false
  unrs-resolver: false

# Firestore ainda fixa ~1.9.0, que possui alertas GHSA-m9gg-hp2v-232j e
# GHSA-f596-whhp-79r4. Mantemos a mesma major com a correcao aplicada.
# O MundoJS usa Firebase App/Auth; nao utiliza o cliente Firestore.
overrides:
  '@firebase/firestore>@grpc/grpc-js': 1.14.7
  # @vercel/functions -> @vercel/oidc fixa Zod 4.1.11 via cli-config.
  # Correcao da mesma major para GHSA-mrhx-c7xc-m3w5.
  '@vercel/cli-config>zod': 4.6.7
