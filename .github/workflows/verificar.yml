name: Verificar MundoJS

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipagem, testes, seguranca e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mundojs_ci
          POSTGRES_USER: mundojs_ci
          POSTGRES_PASSWORD: apenas_ci_descartavel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mundojs_ci -d mundojs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://mundojs_ci:apenas_ci_descartavel@localhost:5432/mundojs_ci
      TEST_DATABASE_URL: postgresql://mundojs_ci:apenas_ci_descartavel@localhost:5432/mundojs_ci
      # Valor publico exclusivo de CI. Nenhum segredo de producao e utilizado.
      BETTER_AUTH_SECRET: mundojs-ci-segredo-descartavel-nao-usar-em-producao
      BETTER_AUTH_URL: http://localhost:3001
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false
      - name: Preparar pnpm
        uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          run_install: false
      - name: Instalar dependencias do lockfile
        run: pnpm install --frozen-lockfile
      - name: Auditar dependencias
        run: pnpm audit --audit-level=high
      - name: Aplicar migracoes no banco descartavel
        run: pnpm db:migrate
      - name: Gerar tipos das rotas
        run: pnpm exec next typegen
      - name: Conferir tipos
        run: pnpm typecheck
      - name: Conferir codigo
        run: pnpm lint
      - name: Executar testes com Postgres
        run: pnpm test
      - name: Compilar versao de producao
        run: pnpm build
